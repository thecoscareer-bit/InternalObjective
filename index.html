<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Online Quiz - 25 Questions</title>

<link rel="icon" type="image/png" href="image.png">
<script src="https://cdn.tailwindcss.com"></script>

<!-- EmailJS -->
<script type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="text/javascript">
  emailjs.init('AQrOoA9vgEUwlbyma'); // ✅ your public key
</script>

<style>
@keyframes scrollRightToLeft {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}
.scrolling-question {
  white-space: nowrap;
  animation: scrollRightToLeft 10s linear 2 forwards;
}
</style>
</head>

<body class="bg-slate-100 h-screen flex items-center justify-center overflow-hidden">

<div class="bg-white shadow-2xl rounded-xl w-full max-w-xl p-6 max-h-[90vh] overflow-hidden">

<!-- LOGIN -->
<div id="login">
  <div class="flex justify-center mb-4">
    <img src="THECOS_Google_Form_Header.png" class="max-h-24 object-contain">
  </div>

  <h1 class="text-2xl font-bold text-center mb-4">Online Quiz</h1>

  <input id="studentName" class="w-full border p-2 mb-3 rounded" placeholder="Enter Full Name">
  <input id="studentEmail" type="email" class="w-full border p-2 mb-4 rounded" placeholder="Enter Email Address">

  <button id="startBtn" class="w-full bg-blue-600 text-white py-2 rounded">
    Start Quiz
  </button>
</div>

<!-- EXAM -->
<div id="exam" class="hidden h-full flex flex-col">

  <div class="flex justify-between mb-3">
    <span id="timer" class="text-red-600 font-bold"></span>
    <span class="text-sm text-gray-500">Tab switching disabled</span>
  </div>

  <div class="flex-1 overflow-y-auto">
    <div class="overflow-hidden mb-4">
      <h2 id="question" class="font-semibold text-lg"></h2>
    </div>
    <div id="options" class="space-y-2"></div>
  </div>

  <div class="pt-4 border-t">
    <button id="nextBtn" class="bg-green-600 text-white px-5 py-2 rounded w-full">
      Next
    </button>
  </div>
</div>

<!-- THANK YOU -->
<div id="thankyou" class="hidden text-center">
  <h1 class="text-2xl font-bold text-green-600 mb-4">✅ Thank You</h1>
  <p class="text-gray-700 mb-2">Your exam has been submitted successfully.</p>
  <p class="text-gray-500">You may now close this page.</p>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const QUESTION_VISIBLE_TIME = 28;
  const QUESTION_TIME = 40;

     const QUIZ_QUESTIONS = [
    /* 1 */
    {
      question: "In India, the first Co-operative Society was established in ____________.",
      options: [
        "1912",
        "1904",
        "1949",
        "1919"
      ],
      correct: "1904"
    },

    /* 2 */
    {
      question: "__________ is based on the principle of interest, maximization of profits & exploitation.",
      options: [
        "Socialism",
        "Capitalism",
        "Co-operation",
        "Trade Unionism"
      ],
      correct: "Capitalism"
    },

    /* 3 */
    {
      question: "An important document for the membership in a Co-operative Society is _______.",
      options: [
        "Minute book",
        "Receipt",
        "Passbook",
        "Identity Card"
      ],
      correct: "Identity Card"
    },

    /* 4 */
    {
      question: "The Human Resource Management helps to improve the __________.",
      options: [
        "Production",
        "Productivity",
        "Power",
        "Produce"
      ],
      correct: "Productivity"
    },

    /* 5 */
    {
      question: "What do you understand “S” in the defining SMART Goals?",
      options: [
        "Solution",
        "Specific",
        "Standard",
        "Soft"
      ],
      correct: "Specific"
    },

    /* 6 */
    {
      question: "Which of the following helps the employee to improve their efficiency?",
      options: [
        "Development",
        "Training",
        "Promotion",
        "Transfer"
      ],
      correct: "Training"
    },

    /* 7 */
    {
      question: "Oral examination of candidates for employment is ___________",
      options: [
        "Placement",
        "Screening",
        "Interview",
        "Selection"
      ],
      correct: "Interview"
    },

    /* 8 */
    {
      question: "The highest authority in a Co-operative Society is:",
      options: [
        "Government",
        "Management Committee",
        "Registrar",
        "General Body"
      ],
      correct: "General Body"
    },

    /* 9 */
    {
      question: "Competencies are the ___________",
      options: [
        "Knowledge",
        "Skills",
        "Behaviour",
        "All of these"
      ],
      correct: "All of these"
    },

    /* 10 */
    {
      question: "HRM is ____________ in nature.",
      options: [
        "Pervasive",
        "Evasive",
        "Decisive",
        "Inclusive"
      ],
      correct: "Pervasive"
    },

    /* 11 */
    {
      question: "The major source of cheap rural credit besides bank is ____________",
      options: [
        "Government",
        "Cooperative Societies",
        "Private Lenders",
        "NBFCs"
      ],
      correct: "Cooperative Societies"
    },

    /* 12 */
    {
      question: "The Constitution of a Society is its ____________",
      options: [
        "Act",
        "Rules",
        "General Body",
        "Bylaw"
      ],
      correct: "Bylaw"
    },

    /* 13 */
    {
      question: "Good employer employee relations are the backbone of all ____________",
      options: [
        "Personal activities",
        "Human activities",
        "Personnel activities",
        "Personnel policies"
      ],
      correct: "Personnel activities"
    },

    /* 14 */
    {
      question: "Employees can be appraisal against ___________",
      options: [
        "Relative standards",
        "Objective",
        "Absolute standards",
        "Group"
      ],
      correct: "Relative standards"
    },

    /* 15 */
    {
      question: "The binding up of a Co-operative Society means ___________",
      options: [
        "Registration",
        "Liquidation",
        "Amalgamation",
        "Reconstruction"
      ],
      correct: "Liquidation"
    },

    /* 16 */
    {
      question: "The process of providing the trainees the information about their performance _______",
      options: [
        "Feedback",
        "Observation",
        "Suggestion",
        "Research"
      ],
      correct: "Feedback"
    },

    /* 17 */
    {
      question: "___________ is a formal & detailed study of jobs.",
      options: [
        "Job enrichment",
        "Job evaluation",
        "Job classification",
        "Job analysis"
      ],
      correct: "Job evaluation"
    },

    /* 18 */
    {
      question: "_______ has the right to sign in the identity card of a member of Co-operative Society.",
      options: [
        "Registrar",
        "President",
        "Secretary",
        "Election Officer"
      ],
      correct: "Secretary"
    },

    /* 19 */
    {
      question: "A kind of future oriented training ______________",
      options: [
        "Employee training",
        "Employability",
        "Employee development",
        "Employee potential"
      ],
      correct: "Employee development"
    },

    /* 20 */
    {
      question: "The members of a Co-operative Society have ____________ liability.",
      options: [
        "Limited",
        "Unlimited",
        "Joint",
        "Joint & Several"
      ],
      correct: "Limited"
    },

    /* 21 */
    {
      question: "What is the meaning of the word “Co-operari”?",
      options: [
        "Mutual help",
        "Working together",
        "All for one & one for all",
        "Each for all & all for each"
      ],
      correct: "Working together"
    },

    /* 22 */
    {
      question: "The objective of Co-operative society is _________",
      options: [
        "Profit",
        "Service",
        "Self help",
        "Mutual help"
      ],
      correct: "Service"
    },

    /* 23 */
    {
      question: "One of the most popular methods of increasing employee responsibility & control is:",
      options: [
        "Outsourcing",
        "Military model",
        "Work teams",
        "Manpower planning"
      ],
      correct: "Work teams"
    },

    /* 24 */
    {
      question: "Which of the following is not a type of Co-operative society?",
      options: [
        "Producer",
        "Consumer",
        "Retail",
        "Housing"
      ],
      correct: "Retail"
    },

    /* 25 */
    {
      question: "Businessmen could get an opportunity to earn huge profits as the cost of ________",
      options: [
        "Employee",
        "Employee & Employer",
        "Employer",
        "Superior"
      ],
      correct: "Employee"
    }

  ];


  const login = document.getElementById("login");
  const exam = document.getElementById("exam");
  const thankyou = document.getElementById("thankyou");
  const startBtn = document.getElementById("startBtn");
  const nextBtn = document.getElementById("nextBtn");

  const nameInput = document.getElementById("studentName");
  const emailInput = document.getElementById("studentEmail");
  const timerEl = document.getElementById("timer");
  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");

  let index = 0;
  let answers = [];
  let timer = null;
  let hideTimer = null;
  let timeLeft = QUESTION_TIME;
  let examFinished = false;
startBtn.addEventListener("click", () => {

    if (!nameInput.value.trim() || !emailInput.value.trim()) {
      alert("Enter name and email");
      return;
    }

    login.classList.add("hidden");
    exam.classList.remove("hidden");
	if (document.documentElement.requestFullscreen) {
	  document.documentElement.requestFullscreen();
}    loadQuestion();
  });

  function loadQuestion() {
    const q = QUIZ_QUESTIONS[index];

    questionEl.classList.remove("scrolling-question");
    void questionEl.offsetWidth;
    questionEl.textContent = q.question;
    questionEl.style.visibility = "visible";
    questionEl.classList.add("scrolling-question");

    optionsEl.innerHTML = "";
    q.options.forEach((opt, i) => {
      const label = document.createElement("label");
      label.className = "block border p-2 rounded cursor-pointer";
      label.innerHTML = `<input type="radio" name="option" value="${opt}" class="mr-2">${opt}`;
      optionsEl.appendChild(label);
    });

    hideTimer = setTimeout(() => {
      questionEl.style.visibility = "hidden";
    }, QUESTION_VISIBLE_TIME * 1000);

    timeLeft = QUESTION_TIME;
    updateTimer();

    timer = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) nextQuestion();
    }, 1000);
  }

  function updateTimer() {
    timerEl.textContent = `Time left: ${timeLeft}s`;
  }

  function nextQuestion() {
    clearInterval(timer);
    clearTimeout(hideTimer);

    const selected = document.querySelector('input[name="option"]:checked');
    answers.push(selected ? selected.value : "Not Answered");

    index++;
    index < QUIZ_QUESTIONS.length ? loadQuestion() : finishExam();
  }

  nextBtn.addEventListener("click", nextQuestion);

  //function sendResultsEmail() {
    //let result = "";
    //QUIZ_QUESTIONS.forEach((q, i) => {
      //result += `Q${i+1}: ${q.question}\nAnswer: ${answers[i]}\n\n`;
    //});

    //emailjs.send("service_8yr4zf5",   
    //"template_kyqnyrd",  {
      //student_name: nameInput.value,
      //student_email: emailInput.value,
      //answers: result
    //}).catch(err => console.error("EmailJS error:", err));
  //}
  
  
  function calculateScore() {
  let score = 0;

  QUIZ_QUESTIONS.forEach((q, i) => {
    if (answers[i] === q.correct) {
      score++;
    }
  });

  return score;
}


  function sendResultsEmail() {
  let result = "";

  QUIZ_QUESTIONS.forEach((q, i) => {
    result += 
`Q${i + 1}: ${q.question}
Selected Answer: ${answers[i]}
Correct Answer: ${q.correct}

`;
  });

  const score = calculateScore();
  const total = QUIZ_QUESTIONS.length;

  emailjs.send(
    "service_8yr4zf5",
    "template_kyqnyrd",
    {
      student_name: nameInput.value,
      student_email: emailInput.value,
      score: `${score} / ${total}`,
      answers: result
    }
  ).catch(err => console.error("EmailJS error:", err));
}


  function finishExam() {
    examFinished = true;
    clearInterval(timer);
    clearTimeout(hideTimer);
    document.exitFullscreen?.();

    sendResultsEmail();

    exam.classList.add("hidden");
    thankyou.classList.remove("hidden");

    setTimeout(() => location.reload(), 5000);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !examFinished) {
      alert("Tab switching detected. Exam terminated.");
      location.reload();
    }
  });

});
</script>

</body>
</html>
